    <style>
        /* Estilos generales del fondo y texto */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("images.jpg") center center / cover no-repeat; /* Fondo con degradado morado y azul */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contenedor principal blanco con sombra */
        .tarjeta {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-bottom: 5px;
            color: #4a5568;
        }

        p {
            color: #718096;
            margin-bottom: 25px;
        }

        /* Estilo de los botones/enlaces */
        .boton {
            display: block;
            background-color: #4f46e5; /* Color del botón */
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        /* Efecto al pasar el cursor o presionar el botón */
        .boton:hover {
            background-color: #4338ca;
        }

        .boton.whatsapp {
            background-color: #25d366; /* Color verde para WhatsApp */
        }
        .boton.whatsapp:hover {
            background-color: #20ba5a;
        }

        /* Estilo para el código QR */
        .qr-container {
            margin-top: 25px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .qr-container img {
            max-width: 150px;
            border-radius: 10px;
        }
    </style>
</head>
